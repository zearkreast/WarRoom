<!doctype html>
<html lang="en">
  <head>

    <meta name="theme-color" content="#0b0b0a" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WarCommand Tracker</title>
    <meta name="description" content="A fan-made companion for the Helldivers 2 Galactic War: the fronts, the Major Order, the galaxy map and Strohmann News." />
    <meta name="format-detection" content="telephone=no" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />

    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 2 29 8v8c0 7-5.5 12-13 14C8.5 28 3 23 3 16V8z' fill='%230b0b0a' stroke='%23ffe710' stroke-width='2'/%3E%3Cpath d='m16 9 2.2 4.6 5 .6-3.7 3.4 1 5-4.5-2.5-4.5 2.5 1-5-3.7-3.4 5-.6z' fill='%23ffe710'/%3E%3C/svg%3E"
    />

    <link rel="manifest" href="assets/manifest.webmanifest" />
    <link rel="preload" href="assets/fonts/archivo-latin-wdth-normal.woff2" as="font" type="font/woff2" crossorigin />
    <!-- The start-up screen, shown while the app downloads; inline, so it needs nothing else to load first. -->
    <style>
      html,
      body {
        background: #070706;
      }
      #boot,
      .boot-nojs {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 14px;
        background: radial-gradient(circle at 50% 42%, #1a1915, #070706 60%);
        color: #958f81;
        font: 600 11px/1.4 "Chakra Petch", "Segoe UI", system-ui, sans-serif;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        transition:
          opacity 260ms cubic-bezier(0.2, 0.85, 0.25, 1),
          visibility 0s 260ms;
      }
      #root:not(:empty) + #boot {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      .boot-name {
        font: 800 22px/1 "Archivo Variable", "Arial Narrow", sans-serif;
        font-stretch: 75%;
        letter-spacing: 0.08em;
        color: #f4f1e8;
      }
      .boot-name b {
        color: #ffe710;
      }
      .boot-bar {
        width: 168px;
        height: 2px;
        overflow: hidden;
        background: #2b2924;
      }
      .boot-bar i {
        display: block;
        width: 40%;
        height: 100%;
        background: #ffe710;
        animation: boot-scan 1.1s cubic-bezier(0.45, 0, 0.55, 1) infinite;
      }
      @keyframes boot-scan {
        from {
          transform: translateX(-100%);
        }
        to {
          transform: translateX(250%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-bar i {
          width: 100%;
          opacity: 0.5;
          animation: none;
        }
      }
    </style>
    <link data-trunk rel="rust" href="Cargo.toml" data-bin="warroom" data-wasm-opt="s" />
    <!-- Each stylesheet names its @layer (order declared in fonts.css); within a layer, later files win. -->
    <link data-trunk rel="css" href="src/ui/fonts.css" />
    <link data-trunk rel="css" href="src/ui/theme.css" />
    <link data-trunk rel="css" href="src/ui/ui.css" />
    <link data-trunk rel="css" href="src/features/campaigns/campaigns.css" />

    <link data-trunk rel="css" href="src/features/news/news.css" />
    <link data-trunk rel="css" href="src/features/galactic_campaigns/galactic_campaigns.css" />
    <link data-trunk rel="css" href="src/ui/neon_ring.css" />
    <link data-trunk rel="css" href="src/features/planet/cities.css" />
    <link data-trunk rel="css" href="src/features/planet/siege.css" />
    <link data-trunk rel="css" href="src/features/planet/defense.css" />
    <link data-trunk rel="css" href="src/features/planet/planet.css" />
    <link data-trunk rel="css" href="src/features/hellpad/hellpad.css" />

  <body>
    <div id="root"></div>
    <div id="boot" role="status">
      <svg width="56" height="56" viewBox="0 0 32 32" aria-hidden="true">
        <path d="M16 2 29 8v8c0 7-5.5 12-13 14C8.5 28 3 23 3 16V8z" fill="#0b0b0a" stroke="#ffe710" stroke-width="2" stroke-linejoin="round" />

      </svg>
      <div class="boot-name">WarCommand <b>Tracker</b></div>
      <div class="boot-bar"><i></i></div>
      <div>Establishing uplink</div>
    </div>
