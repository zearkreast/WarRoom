[package]
name = "warcommand-tracker"
version = "0.6.0"
description = "WarCommand Tracker: a Helldivers 2 Galactic War companion"
authors = ["zearkreast"]
edition = "2024"

[lib]
# Not the bin's name: on Windows a lib and bin of one name collide (rust-lang/cargo#8519).
name = "warcommand_tracker_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-http = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Desktop only: Android updates come as a new APK, and Android has no tray to keep a copy running in.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
