# Builds the Tauri app for Windows, macOS, Linux and Android and publishes
# the installers as a GitHub Release.
#
# Run it from the Actions tab (Release -> Run workflow), or push a tag like v0.2.7.
# The release version and name come from src-tauri/tauri.conf.json.
# With "ref" set to an older release's tag, its installers are rebuilt from that code and replace the
# release's files; the APK is skipped, as the Android build can't check out another ref.
name: Release

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag to build, for rebuilding an older release (empty: the branch run from)"
        required: false
        default: ""
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows (.exe / .msi)
          - platform: windows-latest
            args: ""
          # macOS Apple Silicon (.dmg)
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
          # macOS Intel (.dmg)
          - platform: macos-latest
            args: "--target x86_64-apple-darwin"
          # Linux (.AppImage / .deb / .rpm)
          - platform: ubuntu-22.04
            args: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      # The crate uses Rust edition 2024, so the current stable toolchain is required.
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ startsWith(matrix.platform, 'macos') && 'wasm32-unknown-unknown,aarch64-apple-darwin,x86_64-apple-darwin' || 'wasm32-unknown-unknown' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            ./src-tauri -> target

      # Tauri's beforeBuildCommand builds the web app with it.
      - name: Install Trunk
        uses: taiki-e/install-action@v2
        with:
          tool: trunk@0.22.1

      - name: Install the Tauri CLI
        uses: taiki-e/install-action@v2
        with:
          tool: tauri-cli@2.12.4

      # Only for rebuilding a release from before the Rust app: its web app builds with npm.
      - name: Setup Node
        if: hashFiles('package-lock.json') != ''
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install the web app's packages
        if: hashFiles('package-lock.json') != ''
        run: npm ci

      # RPM versions can't hold a hyphen and Tauri has no RPM-only version, so a pre-release such as
      # 0.3.0-beta leaves the RPM out here and builds it in the last step.
      - name: Read the version
        id: version
        if: runner.os == 'Linux'
        run: |
          VERSION=$(jq -r .version src-tauri/tauri.conf.json)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$VERSION" == *-* ]]; then echo "args=--bundles appimage,deb" >> "$GITHUB_OUTPUT"; fi

      - name: Build and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the in-app update bundles; its public half is the updater pubkey in tauri.conf.json.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: "WarRoom v__VERSION__"
          releaseBody: "Installers are listed under Assets below."
          releaseDraft: false
          prerelease: false
          tauriScript: cargo tauri
          args: ${{ matrix.args }} ${{ steps.version.outputs.args }}
          # latest.json, which installed apps read to find and verify a new release.
          includeUpdaterJson: true

      # 0.3.0-beta becomes version 0.3.0, release 0.1.beta: RPM sorts it before 0.3.0's release 1.
      - name: Build and attach the pre-release RPM
        if: steps.version.outputs.args != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          LABEL=${VERSION#*-}
          cargo tauri bundle --bundles rpm --config \
            "{\"version\":\"${VERSION%%-*}\",\"bundle\":{\"createUpdaterArtifacts\":false,\"linux\":{\"rpm\":{\"release\":\"0.1.${LABEL//-/.}\"}}}}"
          gh release upload "v$VERSION" src-tauri/target/release/bundle/rpm/*.rpm --clobber

  # Runs after the desktop builds so the release they create is there to attach the APK to.
  android:
    needs: build
    if: ${{ !cancelled() && !inputs.ref }}
    uses: ./.github/workflows/android.yml
    with:
      publish: true
    secrets: inherit
