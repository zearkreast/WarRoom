[package]
name = "warroom"
version = "0.3.0-beta"
description = "WarCommand Tracker: a Helldivers 2 Galactic War companion"
edition = "2024"
publish = false

[workspace]
members = ["crates/core", "collector"]
# The Tauri shell is built by the Tauri CLI with its own lockfile.
exclude = ["src-tauri"]

[dependencies]
warroom-core = { path = "crates/core" }
leptos = { version = "0.8", features = ["csr"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
console_error_panic_hook = "0.1"

[dependencies.web-sys]
version = "0.3"
features = [
  "AbortController",
  "AbortSignal",
  "AddEventListenerOptions",
  "CanvasRenderingContext2d",
  "CssStyleDeclaration",
  "Document",
  "DomRect",
  "Element",
  "Event",
  "EventTarget",
  "History",
  "HtmlCanvasElement",
  "HtmlElement",
  "HtmlImageElement",
  "KeyboardEvent",
  "Location",
  "MediaQueryList",
  "MouseEvent",
  "Navigator",
  "Clipboard",
  "Performance",
  "PointerEvent",
  "PopStateEvent",
  "Request",
  "RequestInit",
  "Headers",
  "Response",
  "ResizeObserver",
  "ResizeObserverEntry",
  "Storage",
  "SvgElement",
  "SvggElement",
  "TouchEvent",
  "Touch",
  "TouchList",
  "WheelEvent",
  "Window",
  "VisibilityState",
]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
