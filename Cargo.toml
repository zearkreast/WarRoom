[package]
name = "warroom"
version.workspace = true
description = "WarCommand Tracker: a Helldivers 2 Galactic War companion"
edition = "2024"
publish = false

[workspace]
members = ["crates/core", "crates/android-project", "collector"]
# The Tauri shell is built by the Tauri CLI with its own lockfile.
exclude = ["src-tauri"]

[workspace.package]
version = "0.5.0"

[dependencies]
futures = { version = "0.3", default-features = false, features = ["std", "async-await"] }
warroom-core = { path = "crates/core" }
leptos = { version = "0.8", features = ["csr"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
regex-lite = "0.1"
console_error_panic_hook = "0.1"
send_wrapper = "0.6"
any_spawner = { version = "0.3", features = ["wasm-bindgen"] }

[dependencies.web-sys]
version = "0.3"
features = [
  "AbortController",
  "AbortSignal",
  "AddEventListenerOptions",
  "AudioBuffer",
  "AudioBufferSourceNode",
  "AudioContext",
  "AudioContextState",
  "AudioDestinationNode",
  "AudioNode",
  "AudioParam",
  "AudioScheduledSourceNode",
  "BiquadFilterNode",
  "BiquadFilterType",
  "CanvasRenderingContext2d",
  "IntersectionObserverEntry",
  "IntersectionObserver",
  "CanvasPattern",
  "CanvasGradient",
  "ImageData",
  "CssStyleDeclaration",
  "CssRuleList",
  "CssStyleRule",
  "CssStyleSheet",
  "Document",
  "DomRect",
  "Element",
  "Event",
  "EventTarget",
  "FocusOptions",
  "GainNode",
  "History",
  "HtmlCanvasElement",
  "HtmlDialogElement",
  "HtmlElement",
  "HtmlImageElement",
  "KeyboardEvent",
  "Location",
  "MediaQueryList",
  "MediaQueryListEvent",
  "MouseEvent",
  "Navigator",
  "NodeList",
  "OscillatorNode",
  "OscillatorType",
  "Clipboard",
  "Performance",
  "PointerEvent",
  "PopStateEvent",
  "Request",
  "RequestInit",
  "Headers",
  "Response",
  "ResizeObserver",
  "ResizeObserverEntry",
  "Storage",
  "ScrollLogicalPosition",
  "ScrollBehavior",
  "ScrollIntoViewOptions",
  "SvgElement",
  "SvgsvgElement",
  "SvggElement",
  "TouchEvent",
  "Touch",
  "TouchList",
  "WheelEvent",
  "Window",
  "VisibilityState",
]

# The collector's push tests make an RSA key, which is slow without optimisation.
[profile.dev.package.num-bigint-dig]
opt-level = 3

# The collector's release build: quicker to compile on a small server than the app's size-tuned release.
[profile.collector]
inherits = "release"
lto = false
codegen-units = 16
panic = "unwind"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

# tachys 0.2.19 wraps every static SVG child in a stray <g> (breaking <clipPath> and child selectors);
# the vendored copy carries the fix from tachys 0.3. Drop it on the move to leptos 0.9.
[patch.crates-io]
tachys = { path = "vendor/tachys" }
