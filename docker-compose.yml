services:
  collector:
    # `docker compose pull` fetches the published image; `--build` compiles this checkout instead, under the same name.
    image: ghcr.io/zearkreast/warroom-collector:${COLLECTOR_TAG:-latest}
    build:
      context: .
      dockerfile: collector/Dockerfile
    env_file: collector/.env
    restart: unless-stopped
    mem_limit: 128m
    logging:
      driver: json-file
      options:
        max-size: "1m"
        max-file: "3"
