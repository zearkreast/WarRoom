[package]
name = "warroom-core"
version.workspace = true
description = "Galactic War data shapes and logic shared by the WarRoom app and collector"
edition = "2024"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
regex-lite = "0.1"
robust = "1"
